name: Deck Compiler

on:
  push:
    paths:
      - 'Total-pipe/**'
      - '.github/workflows/deck-compiler.yml'
  pull_request:
    paths:
      - 'Total-pipe/**'
      - '.github/workflows/deck-compiler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      PYTHONPATH: Total-pipe
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fonts and current runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install --only-binary=Pillow -r Total-pipe/requirements.txt jsonschema matplotlib
      - name: Confirm Pillow and Raqm coverage
        run: |
          python - <<'PY'
          import PIL
          from PIL import features
          print('Pillow:', PIL.__version__, 'Raqm:', features.check('raqm'))
          assert features.check('raqm'), 'Linux regression job must exercise a Raqm-enabled Pillow wheel'
          PY
      - name: Run compiler regression tests
        run: python -m unittest discover -s Total-pipe/tests -v
      - name: Record backend check scope
        run: |
          echo 'OfficeCLI-dependent tests may skip in this job. Inspect unittest skip reasons.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PowerPoint UI and native PDF acceptance run separately on macOS or Windows.' >> "$GITHUB_STEP_SUMMARY"
