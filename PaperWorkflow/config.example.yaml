paths:
  input_dir: ./INput
  output_dir: ''
  merge_output_dir: ./Merge_outputs
  temp_dir: ./temp_markdowns
api:
  mineru:
    mode: official_cli
    cli_command: mineru-open-api
    local_command: mineru
    local_backend: hybrid-http-client
    local_backend_url: http://127.0.0.1:30000
    extract_mode: precision
    ocr: true
    model: vlm
    timeout: 1800
    polling_interval: 10
    api_key: ''
    legacy_http: false
  llm:
    api_key: ''
    base_url: https://api.openai.com/v1
    model_name: gpt-5
    timeout: 400
processing_rules:
  remove_references: false
  is_merger_md: true
  default_mode: skim
  max_prompt_chars: 60000
  chunk_chars: 6000
  deep_read_ids:
  - '4668'
  - '4670'
  - '4698'
  skim_ids:
  - '4586'
  - '4587'
concurrency:
  max_workers: 4
